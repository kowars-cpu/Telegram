name: Build Telegram APK

on:
  workflow_dispatch:
  push:
    tags:
      - "apk-*"

permissions:
  contents: write

concurrency:
  group: telegram-android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: platform-tools
          packages: platform-tools

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses

      - name: Install Android components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj:assembleDebug \
            --build-cache --parallel --console=plain

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK="$(find TMessagesProj/build/outputs/apk \
            -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "APK_NOT_FOUND: Gradle did not produce an APK in the expected directory."
            find TMessagesProj/build/outputs -type f 2>/dev/null || true
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Telegram APK build ${{ github.run_number }}
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: false
