name: Build VeexGram APK

on:
  workflow_dispatch:
  push:
    branches:
      - veexgram-13.0.2

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon --stacktrace --console=plain

      - name: Find APK files
        if: always()
        run: |
          if [ -d TMessagesProj_App/build/outputs ]; then
            find TMessagesProj_App/build/outputs -type f -name "*.apk" -print
          else
            echo "APK output directory not created."
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VeexGram-debug-apk
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
