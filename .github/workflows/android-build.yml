name: Build Telegram APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;27.2.12479018
            cmake;3.22.1

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/27.2.12479018
            /usr/local/lib/android/sdk/cmake/3.22.1
            /usr/local/lib/android/sdk/build-tools/36.0.0
            /usr/local/lib/android/sdk/platforms/android-36
          key: android-sdk-ubuntu-2204-ndk27-cmake3221-v1

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj:assembleDebug \
            --build-cache --parallel --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Debug-APK
          path: TMessagesProj/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
